[project]
name = "cfb-ticker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]

[project.scripts]
cfb-ticker = "cfb_ticker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfb_ticker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
